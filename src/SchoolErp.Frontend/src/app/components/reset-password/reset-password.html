<div class="reset-container">
  <h2>Reset Password</h2>

  <div *ngIf="errorMessage" class="error">{{ errorMessage }}</div>
  <div *ngIf="successMessage" class="success">{{ successMessage }}</div>

  <form (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label>Email</label>
      <input type="email" [(ngModel)]="form.email" name="email" readonly />
    </div>

    <div class="form-group">
      <label>New Password</label>
      <input type="password" [(ngModel)]="form.newPassword" name="newPassword" required />
    </div>

    <div class="form-group">
      <label>Confirm Password</label>
      <input type="password" [(ngModel)]="form.confirmPassword" name="confirmPassword" required />
    </div>

    <button type="submit" [disabled]="isSubmitting">Reset Password</button>
  </form>
</div>
