version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: schoolerp-postgres
    environment:
      POSTGRES_DB: schoolerp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - schoolerp-network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: schoolerp-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@schoolerp.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - schoolerp-network

  adminer:
    image: adminer:latest
    container_name: schoolerp-adminer
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    networks:
      - schoolerp-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: schoolerp-backend
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:5000
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=schoolerp;Username=postgres;Password=postgres
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - schoolerp-network
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: schoolerp-frontend
    ports:
      - "4200:4200"
    environment:
      API_URL: http://backend:5000
    depends_on:
      - backend
    networks:
      - schoolerp-network
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  postgres_data:

networks:
  schoolerp-network:
    driver: bridge
